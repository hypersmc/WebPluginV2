Settings:
  # ── Web Server Ports ──
  HTMLPORT: 25567
  PHPPort: 25568
  LocalFPM: 25569         # Very important if you decide to use PHP.

  # ── Server Settings ──
  ServerLocation: /home/container/   # Include trailing slash.
  IndexLocation: ""                  # Default: "" = /webplugin/php/
  ServerIP: localhost                # Used for PHP and HTML via /webp command.

  # ── Threading ──
  maxThreads: 2

  # ── Debug Settings ──
  debug: false                       # Shows debug log in /webplugin/logs/.

  # ── PHP Settings ──
  EnablePHP: false
  PHPFolderPermissionFix: false       # Runs `chown -R www-data`, auto disables after run.

  # PHP runtime library handling.
  # WebPlugin starts php-fpm with a generated php.ini and LD_LIBRARY_PATH.
  # Empty PHPExtensions means WebPlugin tries to detect enabled extension= lines
  # from the bundled php.ini for backwards compatibility. For the modular runtime,
  # prefer setting PHPExtensions here and let WebPlugin generate php.ini.
  PHPDetectExtensionsFromIni: false
  PHPPreflightCheck: true
  # Extensions must exist under phplinux/bin/php8/extension-packs/<name>/.
  # The modular runtime archive contains these packs, but only this list is loaded.
  PHPExtensions:
    - opcache
    - openssl
    - zlib
    - ctype
    - curl
    - mbstring
    # mbregex is built into mbstring; adding mbregex also maps to mbstring.
    - intl
    - fileinfo
    - pdo_sqlite
    - sqlite3
    - pdo_mysql
    - mysqli
    - zip
    - xml
    - dom
    - simplexml
    - xmlreader
    - xmlwriter
    - gd
    - exif
    - bcmath
    - calendar
    - sockets
    - ftp
    - tokenizer

  # Extra runtime library paths. The modular runtime reads base paths from
  # runtime-manifest.properties, so this is usually only for manual overrides.
  PHPExtraLibraryPaths: []

  # Optional compatibility mapping for old runtimes or manual native library overrides.
  # The modular runtime primarily uses each extension pack's extension.properties file.
  PHPExtensionLibraryPaths: {}

  # ── Dependencies Reminder ──
  # The modular PHP archive is self-contained and includes the native libs it needs
  # under phplinux/bin/php8/lib/base, lib/glibc/lib, and extension-packs/*/libs.
  # WebPlugin does not download GLIBC/LIBONIG/LIBZ as separate archives anymore.

  # ── HTML Settings ──
  EnableHTML: true                  # PHP can also serve HTML.

  # ── Auto Key ──
  Autokey: false                     # Not functional currently.

  # ── NGINX Configuration ──
  denyNginxConfigOverride: false

# ── SSL Configuration ──
SSLSettings:
  EnableSSL: false
  SSLPort: 25570
  SSLDomain: play.domain.com
  SSLPriv: priv-key.pem
  SSLPubl: pub-key.pem

# ── Linux PHP Runtime Settings ──
Linuxphpsettings:
  Errorfolder: /errors/            #UNUSED


# ── GitHub Repo Resources ──
GithubWebPluginPHPRepo: https://github.com/hypersmc/WebPluginV2Repo
GithubWebPluginPHPRepoFilename: WebPlugin-linux-PHP8.4.27-MODULAR.tar.gz
GithubWebPluginNGINXRepoFilename: WebPlugin-linux-NGINX-1.30.6-PRECOMPILED.tar.gz

# ── Internal ──
ConfigVersion: 18                  # DO NOT EDIT
