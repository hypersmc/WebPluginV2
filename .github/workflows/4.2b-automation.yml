name: WebPlugin 4.2B automation checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  compile-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the bundled static Linux amd64 Landlock helper
        run: |
          mkdir -p src/main/resources/native/linux-amd64
          gcc -std=gnu11 -static -O2 -Wall -Wextra -o src/main/resources/native/linux-amd64/webplugin-landlock native/webplugin-landlock.c
          chmod 0755 src/main/resources/native/linux-amd64/webplugin-landlock
          sha256sum src/main/resources/native/linux-amd64/webplugin-landlock
      - name: Compile and package the actual plugin
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify helper is embedded in the plugin JAR
        run: |
          jar tf target/WebPlugin-4.2B.jar | grep -Fx 'native/linux-amd64/webplugin-landlock'
          unzip -p target/WebPlugin-4.2B.jar native/linux-amd64/webplugin-landlock | sha256sum
          test "$(unzip -p target/WebPlugin-4.2B.jar native/linux-amd64/webplugin-landlock | sha256sum | cut -d' ' -f1)" = "$(sha256sum src/main/resources/native/linux-amd64/webplugin-landlock | cut -d' ' -f1)"
      - name: Compile isolated automation tests
        run: |
          mkdir -p target/automation-smoke
          javac -cp target/classes -d target/automation-smoke \
            src/test/java/me/jumpwatch/webserver/automation/ProcessSupervisorSmokeTest.java \
            src/test/java/me/jumpwatch/webserver/automation/TaskEngineSmokeTest.java \
            src/test/java/me/jumpwatch/webserver/automation/LandlockSandboxSmokeTest.java \
            src/test/java/me/jumpwatch/webserver/automation/LandlockHelperInstallerSmokeTest.java
      - name: Test bundled helper auto-install and executable permissions
        run: java -cp target/classes:target/automation-smoke me.jumpwatch.webserver.automation.LandlockHelperInstallerSmokeTest
      - name: Test Landlock fallback policy
        run: java -cp target/classes:target/automation-smoke me.jumpwatch.webserver.automation.LandlockSandboxSmokeTest
      - name: Run process supervisor smoke test
        run: java -cp target/classes:target/automation-smoke me.jumpwatch.webserver.automation.ProcessSupervisorSmokeTest
      - name: Run deployment task persistence smoke test
        run: java -cp target/classes:target/automation-smoke me.jumpwatch.webserver.automation.TaskEngineSmokeTest
      - name: Build and probe native Landlock helper
        run: |
          cp src/main/resources/native/linux-amd64/webplugin-landlock target/webplugin-landlock
          sha256sum target/webplugin-landlock
          set +e
          target/webplugin-landlock --probe
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "Landlock available: checking actual filesystem enforcement"
              gcc -std=gnu11 -O2 -Wall -Wextra -o target/landlock-enforcement-test src/test/native/landlock-enforcement-test.c
              tmp=$(mktemp -d)
              mkdir -p "$tmp/site"
              printf 'minecraft-sensitive' > "$tmp/minecraft-secret"
              target/webplugin-landlock --rx /usr --rx /bin --rx /lib --rx /lib64 --rx "$PWD/target" --rw "$tmp/site" -- \
                "$PWD/target/landlock-enforcement-test" "$tmp/site/allowed" "$tmp/minecraft-secret"
              ;;
            10|11|12) echo "Landlock unavailable on runner ($rc); sandbox enforcement test skipped";;
            *) echo "Landlock probe unexpectedly failed with $rc"; exit 1;;
          esac
      - name: Publish Linux x86-64 beta test binaries
        uses: actions/upload-artifact@v4
        with:
          name: WebPlugin-4.2B-linux-amd64
          path: |
            target/WebPlugin-4.2B.jar
            target/webplugin-landlock
          if-no-files-found: error
          retention-days: 14
